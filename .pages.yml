media:
  - name: assets
    label: 写真フォルダ（assets）
    input: assets
    output: assets
content:
  - name: site-content
    label: サイトの内容（文章・リンク・写真）
    type: file
    path: content.json
    format: json
    fields:
      - name: texts
        label: 文章
        type: object
        fields:
          - name: hero_lead
            label: トップの紹介文
            type: text
          - name: about_lead
            label: DESAとはの紹介文
            type: text
          - name: shinkan_text
            label: 新歓情報の文章
            type: text
          - name: shinkan_schedule
            label: 新歓の日程・会場のお知らせ
            type: text
      - name: links
        label: リンク・ボタン
        type: object
        fields:
          - name: founder_story
            label: 「創立者の物語を読む」のURL（空欄なら未設定）
            type: string
          - name: instagram
            label: InstagramのURL
            type: string
          - name: x
            label: XのURL
            type: string
          - name: questionbox
            label: 質問箱のURL
            type: string
      - name: photos
        label: 写真（差し替え）
        type: object
        fields:
          - name: photo_1
            label: "写真1：京都から世界へ、世界から京都へ。｜カンボジア派遣「ニョニュム」で現地の子どもたちと集まるメンバー"
